{% extends 'base.html' %}

{% block title %}Новая запись{% endblock %}

{% block content %}
<div class="form-card large">
    <h2>Новая страница дневника</h2>
    <form action="{{ url_for('form_create') }}" method="POST">
        <div class="form-group">
            <label for="title">Заголовок темы:</label>
            <input type="text" id="title" name="title" required placeholder="Введите заголовок">
        </div>
        <div class="form-group">
            <label for="subtitle">Подзаголовок:</label>
            <input type="text" id="subtitle" name="subtitle" required placeholder="Введите подзаголовок">
        </div>
        <div class="form-group">
            <label for="text">Основной текст:</label>
            <textarea id="text" name="text" rows="8" required placeholder="Напишите что-нибудь..."></textarea>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn">Сохранить запись</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
