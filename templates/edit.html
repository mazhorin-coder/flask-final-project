{% extends 'base.html' %}

{% block title %}Редактировать запись{% endblock %}

{% block content %}
<div class="form-card large">
    <h2>Редактирование записи</h2>
    <form action="{{ url_for('edit_card', id=card.id) }}" method="POST">
        <div class="form-group">
            <label for="title">Заголовок темы:</label>
            <input type="text" id="title" name="title" value="{{ card.title }}" required>
        </div>
        <div class="form-group">
            <label for="subtitle">Подзаголовок:</label>
            <input type="text" id="subtitle" name="subtitle" value="{{ card.subtitle }}" required>
        </div>
        <div class="form-group">
            <label for="text">Основной текст:</label>
            <textarea id="text" name="text" rows="8" required>{{ card.text }}</textarea>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn">Сохранить изменения</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
