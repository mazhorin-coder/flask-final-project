{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Авторизация</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Имя пользователя:</label>
            <input type="text" id="username" name="username" required placeholder="Ваш логин">
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required placeholder="Ваш пароль">
        </div>
        <button type="submit" class="btn">Войти</button>
    </form>
    <p>Еще нет аккаунта? <a href="{{ url_for('register') }}">Создать аккаунт</a></p>
</div>
{% endblock %}
